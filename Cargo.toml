[package]
name = "reborn-trainer"
version = "1.0.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.33.3", default-features = false }
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "instr_info", "std"] }
png = "0.18"
rfd = { version = "0.15.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
strip = "debuginfo"

[build-dependencies]
winresource = "0.1"
